server {
  listen 8087;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /dardops.acs {
    default_type text/plain;
    try_files $uri =404;
  }

}
