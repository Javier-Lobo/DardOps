services:
  dardops:
    build:
      context: .
    container_name: DardOps
    restart: unless-stopped
    ports:
      - "3847:8087"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=2m,noexec,nosuid
